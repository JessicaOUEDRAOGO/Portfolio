<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessica Ouedraogo — Ingénieure XR &amp; Électromécanique</title>
<meta name="description" content="Portfolio de Jessica Ouedraogo : vision par ordinateur, réalité étendue et automatisation industrielle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div style="display:flex; gap:1rem; align-items:center;">
      <div class="avatar" id="avatar">JO</div>
      <div class="identity">
        <h1 id="identity-name"></h1>
        <div class="role" id="identity-role"></div>
      </div>
    </div>

    <p class="bio" id="identity-bio"></p>
    <p class="motivation" id="identity-motivation"></p>

    <section class="skills">
      <h2>Ce que je fais</h2>
      <ul id="skills-list"></ul>
    </section>

    <section class="formation">
      <h2>Formation</h2>
      <ul id="formation-list"></ul>
    </section>

    <section class="contact">
      <h2>Contact</h2>
      <a href="#" id="contact-github" target="_blank" rel="noopener"><span class="dot"></span>GitHub</a>
      <a href="#" id="contact-linkedin" target="_blank" rel="noopener"><span class="dot"></span>LinkedIn</a>
      <a href="#" id="contact-email"><span class="dot"></span>Email</a>
    </section>
  </aside>

  <main class="stage">
    <div class="crumbs" id="crumbs"></div>

    <div class="home-view" id="view-home"></div>

    <div class="theme-view hidden" id="view-theme">
      <h2 id="theme-title"></h2>
      <p class="tagline" id="theme-tagline"></p>
      <div class="project-list" id="project-list"></div>
    </div>

    <div class="detail-view hidden" id="view-detail">
      <div class="meta" id="detail-meta"></div>
      <h2 id="detail-title"></h2>
      <div class="d-block" id="block-description">
        <p id="detail-description"></p>
      </div>
      <div class="d-block" id="block-problem">
        <h4>Problématique</h4>
        <p id="detail-problem"></p>
      </div>
      <div class="d-block" id="block-solution">
        <h4>Solution développée</h4>
        <p id="detail-solution"></p>
      </div>
      <div class="d-block" id="block-result">
        <h4>Résultat &amp; transférabilité</h4>
        <p id="detail-result"></p>
      </div>
      <div class="tools" id="detail-tools"></div>
      <div class="media-block" id="detail-media"></div>
      <a class="detail-link hidden" id="detail-link" target="_blank" rel="noopener">Voir le code sur GitHub →</a>
    </div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
